name: Build MRS PAY Sync APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Assemble Android Folder Structure and Build APK
      run: |
        # 1. Create proper android directories
        mkdir -p app/src/main/java/com/mrstopup/smsforwarder
        mkdir -p app/src/main/res/layout

        # 2. Move source code and resources into standard paths
        mv -f MainActivity.java app/src/main/java/com/mrstopup/smsforwarder/ 2>/dev/null || true
        mv -f SmsReceiver.java app/src/main/java/com/mrstopup/smsforwarder/ 2>/dev/null || true
        mv -f AndroidManifest.xml app/src/main/ 2>/dev/null || true
        mv -f activity_main.xml app/src/main/res/layout/ 2>/dev/null || true

        # 3. Setup app build.gradle
        if [ -f "build (1).gradle" ]; then
          mv -f "build (1).gradle" app/build.gradle
        fi

        # 4. Clean settings.gradle with google plugin repositories
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "MRSPaySync"
        include ':app'
        EOF

        # 5. Root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
        }
        EOF

        # 6. gradle.properties
        printf "android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2048m\n" > gradle.properties

        # 7. Generate Gradle Wrapper 8.2 and build
        gradle wrapper --gradle-version 8.2
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MRSPaySync-v1.0
        path: app/build/outputs/apk/debug/*.apk
