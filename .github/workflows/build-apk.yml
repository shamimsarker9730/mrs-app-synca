name: Build MRS PAY Sync APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Debug APK
      run: |
        # Find where settings.gradle or build.gradle exists
        TARGET_DIR=$(find . -name "settings.gradle" -exec dirname {} \; | head -n 1)
        if [ -z "$TARGET_DIR" ]; then
          TARGET_DIR="."
        fi
        echo "Found project at: $TARGET_DIR"
        cd "$TARGET_DIR"

        # If app directory is missing, make sure Gradle knows the structure
        ls -la
        gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MRSPaySync-v1.0
        path: "**/build/outputs/apk/debug/*.apk"
